services:
  mysql:
    image: mysql:8.4
    container_name: time-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Root123#
      MYSQL_DATABASE: time
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
