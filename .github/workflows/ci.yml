name: CI

on:
  push:
    branches:
      - main
      - DB_Setup_MySQL_Prisma_ExpressJS
  pull_request:
    branches:
      - main
      - DB_Setup_MySQL_Prisma_ExpressJS

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: Root123#
          MYSQL_DATABASE: time
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pRoot123# --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:Root123%23@127.0.0.1:3306/time
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply Prisma migrations
        run: npm run prisma:migrate:deploy

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Frontend type-check
        run: npm run type-check

      - name: Server type-check
        run: npm run type-check:server
